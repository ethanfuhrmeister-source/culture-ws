# Publishes the site to GitHub Pages on every push to main.
#
# ONE-TIME SETUP: Settings -> Pages -> Source -> "GitHub Actions".
# That single dropdown is the only manual step. It cannot be automated: creating
# a Pages site needs repo-admin rights, which the Actions GITHUB_TOKEN does not
# have (configure-pages with `enablement: true` fails with "Resource not
# accessible by integration"). Once the source is set, every push to main
# deploys on its own and nothing here needs touching again.
#
# The site is plain static files with no build step, so the whole repository is
# uploaded as-is.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
